# Compila la app en un Mac de GitHub y deja un .ipa sin firmar para descargar.
# xtool no puede compilar las macros de SwiftData (@Model) en Linux, así que se
# compila aquí y en Ubuntu solo se firma e instala con "xtool install".
name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          xcodebuild -project SportStats.xcodeproj -target SportStats \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SportStats.app Payload/
          zip -qr SportStats.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SportStats-ipa
          path: SportStats.ipa
          retention-days: 14
